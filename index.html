<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes"
    />
    <title>Jadwal Imsakiyah Ramadhan 1447 H | Medan</title>
    <link rel="stylesheet" href="style.css" />
    <!-- import font Inter dan DM Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=DM+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="ramadan-card" id="appModern">
      <div class="header-compact">
        <div class="ramadan-badge">🌙 Ramadan 1447 H</div>
        <h1 class="title-glow">Jadwal Imsakiyah</h1>
        <div class="subtitle-modern">
          <span>Kota Medan</span>
          <span>Sumatera Utara</span>
          <span>Indonesia</span>
        </div>
        <div class="location-card">
          <span>📍 3.58° LS, 98.67° BT</span>
          <span>⏳ Asia/Jakarta</span>
          <span>🕋 Kiblat 292°</span>
        </div>
      </div>

      <!-- countdown realtime modern -->
      <div class="countdown-glass" id="countdownModern">
        <div class="next-prayer-modern">
          <span class="next-label-pill">🕐 Berikutnya</span>
          <span class="next-name-big" id="nextPrayerModern">Imsak</span>
        </div>
        <div class="countdown-digital" id="countdownDisplayModern">
          --:--:--
        </div>
        <div class="date-chip" id="dateChipModern">19 Feb 2026</div>
      </div>

      <!-- tabel container -->
      <div class="table-wrapper-modern" id="modernTableWrapper"></div>

      <!-- footer modern -->
      <div class="legend-modern">
        <div class="legend-items">
          <span class="legend-dot"><i class="dot past-dot"></i> Lewat</span>
          <span class="legend-dot"
            ><i class="dot current-dot"></i> Sedang berlangsung</span
          >
          <span class="legend-dot"
            ><i class="dot upcoming-dot"></i> Akan datang</span
          >
          <span class="legend-dot"
            ><i class="dot next-dot"></i> Berikutnya (countdown)</span
          >
        </div>
        <div class="footer-note-modern">
          <span>⏱️ update realtime</span>
          <span>✨ 30 hari berkah</span>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
